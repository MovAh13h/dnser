description = "CNAME response: A query for www.example.com returns CNAME to example.com"

# Offsets:
#   12: www.example.com name (17 bytes, ends at 28)
#   Answer name: c0 0c = pointer to offset 12 (www.example.com)
#   RDATA: c0 10 = pointer to offset 16 (start of example.com within question name)

hex = """
  11 11 81 80 00 01 00 01 00 00 00 00
  03 77 77 77 07 65 78 61 6d 70 6c 65 03 63 6f 6d 00
  00 01 00 01
  c0 0c 00 05 00 01 00 00 01 2c 00 02 c0 10
"""

[expect]
id = 0x1111
qr = true
rd = true
qd_count = 1
an_count = 1

[[expect.questions]]
name = "www.example.com"
qtype = "A"

[[expect.answers]]
name = "www.example.com"
ttl = 300
rtype = "CNAME"
cname = "example.com"
