[package]
name = "dnser-server"
description = "UDP/TCP DNS server runtime and connection lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/dnser-server"
keywords = ["dns", "server", "udp", "tcp", "networking"]
categories = ["network-programming", "asynchronous"]

[dependencies]
dnser-cache = { path = "../dnser-cache" }
dnser-config = { path = "../dnser-config" }
dnser-net = { path = "../dnser-net" }
dnser-proto = { path = "../dnser-proto" }
dnser-resolver = { path = "../dnser-resolver" }
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "signal", "sync", "time", "macros"] }
tracing = "0.1"
socket2 = { version = "0.5", features = ["all"] }

[dev-dependencies]
dnser-net = { path = "../dnser-net" }
dnser-testing = { path = "../dnser-testing" }