[package]
name = "dnser-resolver"
description = "Recursive DNS resolver and forwarding logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/dnser-resolver"
keywords = ["dns", "resolver", "recursive", "forwarding", "networking"]
categories = ["network-programming", "asynchronous"]

[dependencies]
dnser-config = { path = "../dnser-config" }
dnser-proto = { path = "../dnser-proto" }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
